name: Feature request
description: Suggest a new capability.
title: "[Feature]: "
labels: ["help-wanted"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What commerce standard, dataset, engine, forecast, or agent workflow need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
